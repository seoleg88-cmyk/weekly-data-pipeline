name: Weekly market data fetch

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (no network)
        run: python -m unittest tests/test_offsets.py -v

      - name: Fetch prices (yfinance, 9 assets)
        run: python scripts/fetch_prices.py data/latest_prices.json

      - name: Fetch rates (FRED, keyless CSV)
        run: python scripts/fetch_rates.py data/latest_rates.json

      - name: Commit data files
        run: |
          git config user.name "weekly-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest_prices.json data/latest_rates.json
          git diff --cached --quiet && echo "No changes" || git commit -m "data: weekly fetch $(date -u +%Y-%m-%d)"
          git push
